kind = "web"
previewPath = "/"
title = "GOAT-PAY"
version = "1.0.0"
id = "artifacts/goat-pay"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24570

[services.development]
run = "pnpm --filter @workspace/goat-pay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/goat-pay", "run", "build" ]
publicDir = "artifacts/goat-pay/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24570"
BASE_PATH = "/"
